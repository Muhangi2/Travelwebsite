[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived cache for hashed JS/CSS chunks (Vite adds content hash to filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Long-lived cache for images
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# Long-lived cache for videos
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Brotli/gzip pre-compressed assets
[[headers]]
  for = "/*.br"
  [headers.values]
    Content-Encoding = "br"

[[headers]]
  for = "/*.gz"
  [headers.values]
    Content-Encoding = "gzip"
